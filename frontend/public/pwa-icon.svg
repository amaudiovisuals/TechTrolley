<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background -->
  <rect width="512" height="512" fill="#020617" rx="80"/>

  <!-- Shopping cart body -->
  <g transform="translate(256, 220)">
    <!-- Cart basket -->
    <rect x="-110" y="-70" width="220" height="140" rx="18" fill="none" stroke="#00AEEF" stroke-width="18"/>
    <!-- QR dots inside basket -->
    <rect x="-80" y="-40" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.9"/>
    <rect x="-80" y="-10" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.6"/>
    <rect x="-50" y="-40" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.6"/>
    <rect x="-50" y="-10" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.9"/>
    <rect x="-20" y="-40" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.4"/>
    <rect x="-20" y="-10" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.8"/>
    <rect x="10" y="-40" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.9"/>
    <rect x="10" y="-10" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.5"/>
    <rect x="40" y="-40" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.7"/>
    <rect x="40" y="-10" width="22" height="22" rx="4" fill="#00AEEF" opacity="0.9"/>
    <!-- Cart handle -->
    <path d="M -110,-70 Q -130,-110 -160,-120 L -180,-120" stroke="#00AEEF" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Cart wheels -->
    <circle cx="-60" cy="90" r="22" fill="#F15A24"/>
    <circle cx="60" cy="90" r="22" fill="#F15A24"/>
  </g>

  <!-- Orange barcode lines at bottom -->
  <g transform="translate(256, 400)">
    <rect x="-90" y="0" width="12" height="40" rx="3" fill="#F15A24"/>
    <rect x="-70" y="0" width="6" height="40" rx="2" fill="#F15A24" opacity="0.8"/>
    <rect x="-56" y="0" width="16" height="40" rx="3" fill="#F15A24"/>
    <rect x="-32" y="0" width="8" height="40" rx="2" fill="#F15A24" opacity="0.8"/>
    <rect x="-16" y="0" width="14" height="40" rx="3" fill="#F15A24"/>
    <rect x="6" y="0" width="6" height="40" rx="2" fill="#F15A24" opacity="0.8"/>
    <rect x="20" y="0" width="18" height="40" rx="3" fill="#F15A24"/>
    <rect x="46" y="0" width="8" height="40" rx="2" fill="#F15A24" opacity="0.8"/>
    <rect x="62" y="0" width="16" height="40" rx="3" fill="#F15A24"/>
    <rect x="86" y="0" width="6" height="40" rx="2" fill="#F15A24" opacity="0.8"/>
  </g>
</svg>
