name: Deploy Tech Trolley

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (React Build Environment)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile React PWA
        run: npm run build
        env:
          VITE_API_URL: https://techtrolley.amaudiovisuals.com

      - name: Transfer React Build to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist"
          target: "/home/ubuntu/TechTrolley/"

      - name: Execute Server Pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/TechTrolley

            # 1. Download the latest Python Code from GitHub
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            # 2. Deploy the compiled React Frontend
            sudo cp -r ~/TechTrolley/dist/* /var/www/html/techtrolley/

            # 3. Update the Python Backend Environment
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate

            # 4. Load the latest production data (assets, conferences, users)
            python manage.py loaddata production_data.json

            python manage.py collectstatic --noinput

            # 5. Restart the Backend and Web Server
            sudo systemctl daemon-reload
            sudo systemctl restart gunicorn
            sudo systemctl reload nginx
