name: Deploy Tech Trolley

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (React Build Environment)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile React PWA
        run: npm run build
        env:
          VITE_API_URL: https://techtrolley.amaudiovisuals.com

      - name: Transfer React Build to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist"
          target: "/home/ubuntu/TechTrolley/"

      - name: Transfer Database to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/db.sqlite3"
          target: "/home/ubuntu/db_upload/"

      - name: Execute Server Pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/TechTrolley

            # 1. Download the latest Python Code from GitHub
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            # 2. Deploy the compiled React Frontend
            sudo cp -r ~/TechTrolley/dist/* /var/www/html/techtrolley/

            # 3. REPLACE the production database with the uploaded local database
            #    (This must happen AFTER git reset so it doesn't get overwritten)
            cp ~/db_upload/backend/db.sqlite3 ~/TechTrolley/backend/db.sqlite3
            chmod 664 ~/TechTrolley/backend/db.sqlite3

            # 4. Update the Python Backend Environment
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt

            # 5. Apply schema migrations (data is already in db.sqlite3)
            python manage.py migrate

            python manage.py collectstatic --noinput

            # 6. Restart the Backend and Web Server
            sudo systemctl daemon-reload
            sudo systemctl restart gunicorn
            sudo systemctl reload nginx
