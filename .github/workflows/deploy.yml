name: Validate and deploy Tech Trolley

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: techtrolley-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r scripts/hotfix-test-requirements.in
      - name: Test inventory contracts in memory
        run: python -B scripts/run_hotfix_tests.py
      - name: Check migration model consistency
        run: python -B scripts/run_hotfix_tests.py --check-migrations
      - name: Test PostgreSQL transactions and simultaneous delivery requests
        run: python -B scripts/run_hotfix_tests.py
        env:
          TT_TEST_POSTGRES_NAME: codex_delivery_acceptance_ci
          TT_TEST_POSTGRES_HOST: 127.0.0.1
          TT_TEST_POSTGRES_PASSWORD: synthetic-ci-only
      - name: Check code-only activation script
        run: |
          bash -n scripts/deployment/activate_inventory_hotfix.sh
          bash -n scripts/deployment/activate_delivery_documents.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: node scripts/test_inventory_helpers.cjs
      - run: npx tsc --noEmit
      - name: Build exact candidate
        run: |
          npm run build
          printf '%s\n' "$CANDIDATE_REVISION" > dist/build-revision.txt
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Transfer validated frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist
          target: /home/ubuntu/TechTrolley/
      - name: Checkpoint and activate exact tested revision
        uses: appleboy/ssh-action@v1.0.3
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CANDIDATE_REVISION
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /home/ubuntu/TechTrolley
            git fetch origin "$CANDIDATE_REVISION" > /dev/null 2>&1 || { echo 'Fetching the tested revision failed; server authentication needs review.'; exit 1; }
            git show "$CANDIDATE_REVISION:scripts/deployment/activate_delivery_documents.sh" | bash -s -- "$CANDIDATE_REVISION"
