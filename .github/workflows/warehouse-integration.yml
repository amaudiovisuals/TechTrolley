name: Review shared warehouse integration
on:
  push:
    branches: [codex/shared-warehouse-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact hash-checked backend runtime
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Check source dependency contracts
        run: python -B scripts/testing/check_dependencies.py --installed
      - name: Check merged schema and all disposable SQLite contracts
        run: |
          python -B scripts/testing/run_backend_tests.py --check-schema
          python -B scripts/testing/run_backend_tests.py
      - name: Prepare private PostgreSQL test binaries
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb || { sudo apt-get update && sudo apt-get install -y postgresql-16; }
      - name: Rehearse production delivery-schema upgrade and all PostgreSQL contracts
        run: python -B scripts/testing/run_postgres_tests.py --pg-bin /usr/lib/postgresql/16/bin --baseline production_0054 --mode all
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lock without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Check quantity, consumable and owner helpers
        run: |
          node scripts/testing/frontend_step4b.cjs
          node scripts/testing/frontend_step4b2.cjs
          node scripts/testing/frontend_step6b.cjs
          node scripts/testing/frontend_program_deliveries.cjs
          node scripts/testing/frontend_challan_selection.cjs
      - name: Typecheck and build exact reviewed frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
      - name: Install the locked browser test engine
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise shared stock scans, saved supplier papers and recovery
        env:
          TT_TEST_PYTHON: python
        run: |
          node scripts/testing/browser_warehouse_quantities.cjs
          node scripts/testing/browser_contacts_transfers.cjs
          node scripts/testing/browser_program_deliveries.cjs
          node scripts/testing/browser_conference_camera.cjs
          node scripts/testing/browser_step6b.cjs
          node scripts/testing/browser_worker_step3.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse-review-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
